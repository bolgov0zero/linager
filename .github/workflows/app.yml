name: app
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface
        run: |
          cd frontend && npm ci && npm run check && npm run build
          node --test src/lib/*.test.mjs
      - name: Go packages without a window
        run: go vet ./internal/... && go test ./internal/...

  # The window needs the web view of each system, so it is built on each system (this also checks that the libraries exist).
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Interface
        run: cd frontend && npm ci && npm run build
      - name: Build
        run: go build -o bin/linager-app .
