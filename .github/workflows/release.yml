name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  # the desktop application; like the Windows agent, a failure here does not stop the rest of the release
  app:
    uses: ./.github/workflows/app-release.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [windows, app]
    # the Windows agent is built in its own job; if it fails, the Linux release is still published without it
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build VERSION="${GITHUB_REF_NAME}"
      - name: Windows agent
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: bin
      - name: Desktop application
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: bin
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          git fetch --tags --force
          sh packaging/make-manifest.sh "${GITHUB_REF_NAME}"
          cd bin && sha256sum linager_linux_amd64 linager_linux_arm64 $(ls linager-agent_windows_amd64.exe linager-agent_windows_amd64.msi linager-desktop_macos_arm64.zip linager-desktop-autoupdate_windows_x64.zip linager-desktop_windows_x64.msi linager-desktop_linux_x64.tar.gz 2>/dev/null) > SHA256SUMS
      - name: Sign (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then echo "UNSIGNED=1" >> "$GITHUB_ENV"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/min.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/min.key" -m bin/SHA256SUMS
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/min.key" -m bin/manifest.json
          rm -f "$RUNNER_TEMP/min.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          files="bin/linager_linux_amd64 bin/linager_linux_arm64 bin/SHA256SUMS bin/manifest.json"
          for w in bin/linager-agent_windows_amd64.exe bin/linager-agent_windows_amd64.msi bin/linager-desktop_macos_arm64.zip bin/linager-desktop-autoupdate_windows_x64.zip bin/linager-desktop_windows_x64.msi bin/linager-desktop_linux_x64.tar.gz; do [ -f "$w" ] && files="$files $w"; done
          if [ -n "${UNSIGNED:-}" ]; then flags="--prerelease"; else files="$files bin/SHA256SUMS.minisig bin/manifest.json.minisig"; fi
          # Release notes: this version's section of CHANGELOG.md (the server shows them on the updates page).
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p=($2==v)} p && !/^## /' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then flags="$flags --notes-file $RUNNER_TEMP/notes.md"; else flags="$flags --generate-notes"; fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $flags $files
